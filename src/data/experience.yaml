# Professional experience, most recent first is not required: entries are sorted by start date.
# Dates: "YYYY" or "YYYY-MM". `end: null` means current ("presente" / "present").
# Roles: list every title held at the organisation, with dates; the current one has `end: null`.
# To record a promotion: give the current role an end date and add the new role with `end: null`.
# `position` (current employer only) is used in the bio; {role} is replaced by the current title.
# `internship: true` puts the entry in the compact "summer internships" sub-list.
