# Types of articles (own texts, not peer-reviewed). An article's `type` must be one of these ids.
# `schema` is the JSON-LD type; peer-reviewed work goes in publications.yaml, not here.
- id: opinion
  label: { pt: Opinião, en: Opinion }
  schema: Article
- id: case-commentary
  label: { pt: Comentário de jurisprudência, en: Case commentary }
  schema: Article
- id: ruling-commentary
  label: { pt: Comentário a informação vinculativa, en: Commentary on a binding ruling }
  schema: Article
- id: legislative-note
  label: { pt: Nota legislativa, en: Legislative note }
  schema: Article
