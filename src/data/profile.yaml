    pt:
      - João Gabriel Gonçalves é advogado em Lisboa, inscrito na Ordem dos Advogados desde 2024. É {position}.
      - Trabalha em tributação societária em operações de M&A e reestruturações, contencioso tributário e fiscalidade internacional de pessoas singulares e sociedades. Presta também assessoria fiscal em investimento imobiliário e planeamento fiscal transfronteiriço.
      - Trabalhou antes na KPMG Portugal, como consultor fiscal, e fez o estágio de advocacia no departamento fiscal da Abreu Advogados.
      - É investigador júnior no Nova Tax Research Lab e publica sobre fiscalidade nacional e internacional.
    en:
      - João Gabriel Gonçalves is a lawyer based in Lisbon, admitted to the Portuguese Bar in 2024. He is {position}.
      - His practice covers corporate taxation in M&A and restructurings, tax litigation and the international taxation of individuals and companies. He also advises on real estate investment and cross-border tax planning.
      - He previously worked at KPMG Portugal as a corporate tax consultant and completed his Bar traineeship in the Tax department of Abreu Advogados.
      - He is a junior researcher at the Nova Tax Research Lab and publishes on domestic and international taxation.
